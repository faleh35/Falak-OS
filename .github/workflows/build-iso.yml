name: build-iso
# Builds a branded FalakOS installer ISO for one edition, on demand.
# Run it from the Actions tab: "build-iso" → "Run workflow" → pick the edition.
# The ISO is attached to the finished run as a download (kept for 7 days).
on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to make an installer ISO for"
        required: true
        type: choice
        default: falakos-business
        options:
          - falakos-business
          - falakos-corporate
          - falakos-free
          - falakos-gaming
          - falakos-gaming-nvidia
          - falakos-full
          - falakos-full-nvidia

jobs:
  iso:
    name: ISO for ${{ inputs.edition }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Get the FalakOS installer branding
        uses: actions/checkout@v7.0.1

      # The installer build needs a lot of disk space.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.2
        with:
          tool-cache: true

      - name: Build the installer ISO
        env:
          EDITION: ${{ inputs.edition }}
          OWNER: ${{ github.repository_owner }}
        run: |
          sudo bash iso/build-iso.sh "$EDITION" "$OWNER" "$GITHUB_WORKSPACE/output"
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/output"

      - name: Upload the ISO
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.edition }}-iso
          path: output/*.iso
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
