name: build-iso
# Builds an installer ISO for one FalakOS edition, on demand.
# Run it from the Actions tab: "build-iso" → "Run workflow" → pick the edition.
# The ISO is attached to the finished run as a download (kept for 7 days).
on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to make an installer ISO for"
        required: true
        type: choice
        default: falakos-business
        options:
          - falakos-business
          - falakos-corporate
          - falakos-free
          - falakos-gaming
          - falakos-gaming-nvidia
          - falakos-full
          - falakos-full-nvidia

jobs:
  iso:
    name: ISO for ${{ inputs.edition }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # The installer build needs a lot of disk space.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.2
        with:
          tool-cache: true

      - name: Install the BlueBuild CLI
        run: bash <(curl -fsSL https://raw.githubusercontent.com/blue-build/cli/v0.9.42/install.sh)

      - name: Build the installer ISO
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.edition }}:latest
          ISO_NAME: ${{ inputs.edition }}.iso
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          sudo bluebuild generate-iso \
            --iso-name "$ISO_NAME" \
            --output-dir "$GITHUB_WORKSPACE/output" \
            image "$IMAGE"
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/output"
          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload the ISO
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.edition }}-iso
          path: output/*.iso
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
