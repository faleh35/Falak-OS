name: falakos-installer
on:
  push:
    paths:
      - "installer/**"
      - ".github/workflows/installer.yml"
  pull_request:
    paths:
      - "installer/**"
  workflow_dispatch: # lets you start a build by hand from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linux:
    name: Check, test and build (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: installer
    steps:
      - name: Get the code
        uses: actions/checkout@v7.0.1

      - name: Install the Linux desktop build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Create the Linux window (runner)
        run: |
          flutter --version
          # Adds the generated platform folder; existing files are kept.
          flutter create --platforms=linux --project-name falakos_installer --org org.falak .
          sed -i 's/"falakos_installer"/"FalakOS Installer"/g; s/1280, 720/1280, 800/' linux/runner/my_application.cc
          sed -i 's/set(BINARY_NAME "falakos_installer")/set(BINARY_NAME "falakos-installer")/' linux/CMakeLists.txt

      - name: Get packages
        run: flutter pub get

      - name: Check the code
        run: flutter analyze --no-fatal-infos

      - name: Run the tests
        run: flutter test

      - name: Build
        run: flutter build linux --release

      - name: Package
        run: tar -C build/linux/x64/release/bundle -czf "$GITHUB_WORKSPACE/falakos-installer-linux-x64.tar.gz" .

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: falakos-installer-linux-x64
          path: falakos-installer-linux-x64.tar.gz
          retention-days: 14
