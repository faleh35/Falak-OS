---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# FalakOS base layer: shared by EVERY edition.
# Branding, the three desktop views, the first-login welcome, Arabic support,
# and the essential apps (built into the image, so nothing downloads on first boot).
modules:
  # Copies files/system/* into the image root (/).
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      packages:
        - kdialog # first-login welcome picker dialogs
        # Essential apps for every edition.
        - firefox # web browser
        - firefox-langpacks # Firefox in Arabic and other languages
        - okular # PDF and document viewer
        - gwenview # image viewer
        - kcalc # calculator
        - ark # zip and other archives
        - kate # text editor
        - haruna # video player
        - elisa-player # music player
        - spectacle # screenshots and screen recording
        - filelight # see what fills your disk

  # Arabic-first fonts + an open UI font (no proprietary Apple/Microsoft fonts).
  - type: fonts
    fonts:
      google-fonts:
        - Inter
        - IBM Plex Sans Arabic
        - Cairo
        - Tajawal
        - Amiri

  # Build-time setup: default look, animations, permissions, sanity checks.
  - type: script
    scripts:
      - falak-defaults.sh

  # Applies the account, language and time zone chosen in the FalakOS Installer.
  - type: systemd
    system:
      enabled:
        - falak-firstboot.service
