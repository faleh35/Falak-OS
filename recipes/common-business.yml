---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Business apps: shared by Business, Corporate and Full.
modules:
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          - org.onlyoffice.desktopeditors # Word/Excel/PowerPoint compatible
          - org.mozilla.Thunderbird # mail; native Exchange (EWS) support
          - org.remmina.Remmina # remote desktop (RDP/VNC)
          - org.kde.okular # PDF viewer + annotations
          - com.github.jeromerobert.pdfarranger # merge/split PDFs

  # Disk encryption + VPN tooling (most already exist in the base; dnf skips those).
  - type: dnf
    install:
      packages:
        - cryptsetup
        - NetworkManager-openvpn
        - NetworkManager-openconnect
        - plasma-nm-openvpn
        - plasma-nm-openconnect
