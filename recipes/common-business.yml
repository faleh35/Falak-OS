---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Business apps: shared by Business, Corporate and Full.
# Built into the image, so they are ready on first boot without downloading.
modules:
  - type: dnf
    install:
      packages:
        # ONLYOFFICE Desktop Editors (Word/Excel/PowerPoint compatible), official RPM.
        - https://github.com/ONLYOFFICE/DesktopEditors/releases/latest/download/onlyoffice-desktopeditors.x86_64.rpm
        - thunderbird # mail and calendar; Exchange via EWS
        - remmina # remote desktop
        - remmina-plugins-rdp # Windows Remote Desktop (RDP)
        - remmina-plugins-vnc # VNC
        - pdfarranger # merge, split and reorder PDFs
        - keepassxc # password manager
        - skanpage # scanning documents
        # Disk encryption + VPN tooling (most already exist in the base; dnf skips those).
        - cryptsetup
        - NetworkManager-openvpn
        - NetworkManager-openconnect
        - plasma-nm-openvpn
        - plasma-nm-openconnect
