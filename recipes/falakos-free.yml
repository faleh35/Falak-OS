---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Published as ghcr.io/faleh35/falakos-free
name: falakos-free
description: "FalakOS Free: the light, no-cost edition with the essentials."

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  - from-file: common-base.yml

  - type: os-release
    properties:
      NAME: FalakOS
      PRETTY_NAME: FalakOS Free
      VARIANT: Free
      VARIANT_ID: free
      LOGO: falak-logo
      HOME_URL: https://github.com/faleh35/Falak-OS

  - type: script
    snippets:
      - "mkdir -p /usr/share/falak && echo free > /usr/share/falak/edition"

  # Must stay last: installs the signing policy for this image.
  - type: signing
