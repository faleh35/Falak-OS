---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Published as ghcr.io/faleh35/falakos-full-nvidia
name: falakos-full-nvidia
description: "FalakOS Full for NVIDIA RTX/GTX 16 and newer."

base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: stable

modules:
  - from-file: common-base.yml
  - from-file: common-gaming.yml
  - from-file: common-business.yml
  - from-file: common-full.yml

  - type: os-release
    properties:
      NAME: FalakOS
      PRETTY_NAME: FalakOS Full
      VARIANT: Full (NVIDIA)
      VARIANT_ID: full-nvidia
      LOGO: falak-logo
      HOME_URL: https://github.com/faleh35/Falak-OS

  - type: script
    snippets:
      - "mkdir -p /usr/share/falak && echo full-nvidia > /usr/share/falak/edition"

  # Rebuild the early-boot files so the FalakOS boot logo is used.
  - type: initramfs

  # Must stay last: installs the signing policy for this image.
  - type: signing
