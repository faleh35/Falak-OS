---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Published as ghcr.io/faleh35/falakos-full
name: falakos-full
description: "FalakOS Full: Gaming + Business + creative and developer apps (AMD/Intel)."

base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - from-file: common-base.yml
  - from-file: common-gaming.yml
  - from-file: common-business.yml
  - from-file: common-full.yml

  - type: os-release
    properties:
      NAME: FalakOS
      PRETTY_NAME: FalakOS Full
      VARIANT: Full
      VARIANT_ID: full
      LOGO: falak-logo
      HOME_URL: https://github.com/faleh35/Falak-OS

  - type: script
    snippets:
      - "mkdir -p /usr/share/falak && echo full > /usr/share/falak/edition"

  # Must stay last: installs the signing policy for this image.
  - type: signing
